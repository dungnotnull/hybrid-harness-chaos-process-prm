[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hybrid-harness-chaos-tools"
version = "0.1.0"
description = "Tooling for the 33-skill AI agent framework: validation, docs, scaffolding, and MCP server"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
    "httpx>=0.27",
    "kubernetes>=29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
validate-skills = "tools.validate_skills:main"
generate-docs = "tools.generate_docs:main"
scaffold-skill = "tools.scaffold_skill:main"
chaos-mcp-server = "tools.chaos_mcp_server.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
