# Release Pipeline - Tag and release automation
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Validate all skills before release
        run: |
          python tools/validate_skills.py --project-root .
          python tools/generate_docs.py --project-root .

      - name: Generate release notes
        id: release_notes
        run: |
          echo "Generating release notes from CHANGELOG.md..."
          TAG=+ echo ""
          # Extract section for this version from CHANGELOG.md
          python -c "
          import re
          tag = ''
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              # Find the section for this version
              pattern = rf'## \[{re.escape(tag.lstrip(\"v\"))}\].*?(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  print(match.group())
              else:
                  print(f'Release {tag}')
          except FileNotFoundError:
              print(f'Release {tag}')
          " > release_notes.txt
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          draft: false
          prerelease: false
